[project]
name = "opa-python-client"
version = "3.0.0"
description = "Client for connection to the OPA service"
authors = [{name = "Tural Muradov", email = "tural.muradoov@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.3",
    "requests>=2.34.2",
    "urllib3>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/Turall/OPA-python-client"
Repository = "https://github.com/Turall/OPA-python-client"

[project.scripts]
opa-client = "opa_client.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.3,<9",
    "pytest-asyncio>=0.24.0,<0.25",
    "ruff>=0.6.9,<0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opa_client"]


[tool.ruff]
line-length = 79
exclude = [".venv","tests","migrations"]

[tool.ruff.format]
indent-style = "tab"
docstring-code-format = true
